[package]
name = "chunky"
version = "0.1.4"
edition = "2021"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
futures = "0.3.31"
tokio = { version = "1.42.0", features = ["full"] }
hickory-resolver = { version = "0.24.2", features = [
    "default",
    "dns-over-native-tls",
    "dns-over-openssl",
    "tokio",
    "tokio-native-tls",
    "tokio-openssl",
] }
url = "2.5.4"
env_logger = "0.11.6"
log = "0.4.22"
openssl = { version = "0.10.68", features = ["vendored"] }
